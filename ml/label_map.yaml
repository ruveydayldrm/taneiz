# Farklı veri setlerindeki etiketleri TaneİZ ortak şemasına eşler.
#
# Klasör düzeni: ml/data/raw/<dir>/<kaynak_etiket>/**/*.jpg
# Kaynak etiket eşleşmesi büyük/küçük harf duyarsızdır. `null` → o etiket kullanılmaz.
# prepare_data.py, eşlenmemiş klasörleri raporda listeler; indirdiğiniz sürümün
# klasör adlarını kontrol edip aşağıyı güncelleyin (bkz. DATASETS.md).

target_classes:
  - SAGLIKLI
  - KIRIK_CATLAK
  - BOCEK_SUNE_ZARARI
  - KUFLU
  - LEKELI_RENK_BOZUK
  - BURUSUK_CILIZ

datasets:
  wheatvision:
    # Mendeley v1: train.zip / valid.zip / test.zip → WheatVision_src/<bölme>/images/<etiket>/*.jpg
    # (Roboflow dışa aktarımı; YOLO poligon işaretlemeleri annotations/ altında, kullanılmıyor.)
    # Veri setinin kendi bölmeleri KULLANILMAZ: aynı tanenin artırılmış kopyaları farklı bölmelere
    # dağılmış (sızıntı). Tüm bölmeler birleştirilip tane bazında yeniden bölünür.
    dir: WheatVision_src
    label_glob: "*/images/*"
    source: "WheatVision — Mendeley Data, DOI 10.17632/bx27hg9vwd (v1)"
    license: "CC BY 4.0"
    # Roboflow her fotoğrafı "<orijinal>_jpg.rf.<hash>.jpg" adıyla çoğaltır → orijinal ad = grup
    group_regex: "^(.*?)_(?:jpe?g|png)\\.rf\\."
    labels:
      healthy: SAGLIKLI
      damage: KIRIK_CATLAK # mekanik hasar: çatlak, ezik, delik
      staindamage: LEKELI_RENK_BOZUK
      insectdamage: BOCEK_SUNE_ZARARI
      shriveledseed: BURUSUK_CILIZ
      healthy-70-60: null # kabuklu/farklı görünümlü taneler; anlamı belgelenmemiş
      healthy-50-40: null
      objects: null
      unknown: null

  grainset:
    dir: GrainSet/wheat
    source: "GrainSet (Scientific Data, 2023) — makaledeki veri bağlantısı"
    license: "CC BY 4.0 (makaleden doğrulayın)"
    # Aynı tanenin ön/arka yüz görüntüleri aynı bölmeye düşsün (sızıntı önleme).
    # Dosya adından grup anahtarı çıkaran regex; ilk yakalama grubu kullanılır.
    group_regex: "^(.*?)(?:_[ab]|_front|_back|_up|_down)?\\.(?:jpg|jpeg|png|bmp)$"
    labels:
      "0_nor": SAGLIKLI
      nor: SAGLIKLI
      "1_f&s": BURUSUK_CILIZ
      "f&s": BURUSUK_CILIZ
      "2_sd": null # filizlenmiş — şemada yok
      sd: null
      "3_my": KUFLU
      my: KUFLU
      "4_ap": BOCEK_SUNE_ZARARI
      ap: BOCEK_SUNE_ZARARI
      "5_bn": KIRIK_CATLAK
      bn: KIRIK_CATLAK
      "6_bp": LEKELI_RENK_BOZUK
      bp: LEKELI_RENK_BOZUK
      "7_im": null # yabancı madde
      im: null
      hd: LEKELI_RENK_BOZUK # ısı hasarlı

  sune:
    dir: Sune
    source: "Süne zararlı/sağlam buğday tanesi görüntü seti (bkz. DATASETS.md)"
    license: "Kaynağın lisansını doğrulayın"
    labels:
      saglam: SAGLIKLI
      sağlam: SAGLIKLI
      healthy: SAGLIKLI
      suneli: BOCEK_SUNE_ZARARI
      süneli: BOCEK_SUNE_ZARARI
      sunn_pest_damaged: BOCEK_SUNE_ZARARI
      damaged: BOCEK_SUNE_ZARARI
